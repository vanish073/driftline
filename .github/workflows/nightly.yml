# Nightly (DESIGN §16). Shift 9: the Trivy image scan (D79); the kind smoke test joins it in Shift 9's Kubernetes phase,
# and the 200,000-seed `nightly` campaign and the full canary matrix in Shift 10, with the `nightly` profile.
# Every third-party action is pinned by commit SHA, every container image by digest.
name: nightly

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The app and sandbox images, built from this commit: fails on any high or critical vulnerability that has a fix,
  # in the base image's packages or in the jars inside.
  trivy:
    name: trivy (app and sandbox images)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Trivy image scan
        run: scripts/trivy-scan.sh
