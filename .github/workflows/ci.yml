# CI. DESIGN §16 lists the jobs. Every third-party action is pinned by commit SHA, every container image by digest.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (unit, ArchUnit, jqwik)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the checksum of the committed Gradle wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check (without the Testcontainers suites, which run in the integration job)
        run: ./gradlew check -x :store-postgres:integrationTest -x :app:integrationTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  integration:
    name: integration (PostgreSQL and Kafka in Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Integration tests
        run: ./gradlew :store-postgres:integrationTest :app:integrationTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # DESIGN §16, Shift 4: 4 shards x 2,500 = 10,000 pr seeds. The base seed is derived from the run id, so every run
  # explores new seeds; a failing seed prints its REPRO line and uploads its full trace. Shard 0 also replays
  # sim/regression-seeds.txt and runs the determinism double-run in two separate JVMs.
  simulation:
    name: simulation (shard ${{ matrix.shard }} of 4, 2,500 pr seeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Campaign
        env:
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FROM=$(( RUN_ID * 10000 + 1 ))
          CORPUS=$([ "$SHARD" = "0" ] && echo "regression-seeds.txt" || echo "none")
          echo "base seed $FROM, shard $SHARD/4, corpus $CORPUS"
          ./gradlew :sim:campaign --args="--profile pr --from $FROM --count 10000 --shard $SHARD/4 --threads 4 --regression $CORPUS"

      - name: Determinism (100 seeds twice in one JVM, then the digests diffed across two JVMs)
        if: matrix.shard == 0
        run: |
          ./gradlew :sim:determinism
          cp sim/build/sim-results/digests.txt "$RUNNER_TEMP/digests-first.txt"
          ./gradlew :sim:determinism
          diff "$RUNNER_TEMP/digests-first.txt" sim/build/sim-results/digests.txt
          echo "identical digests across JVMs: $(wc -l < sim/build/sim-results/digests.txt) seeds"

      - name: Upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-failures-shard-${{ matrix.shard }}
          path: sim/build/sim-failures/
          retention-days: 14

  # DESIGN §11.10: each active canary must be caught within 500 pr seeds, by the invariant it is meant to trip.
  canaries-quick:
    name: canaries-quick
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Canaries
        run: ./gradlew :sim:canaries --args="--threads 4 --out build/sim-results/canaries.md"

      - name: Upload the canary table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canaries
          path: sim/build/sim-results/canaries.md
          retention-days: 14

  # Milestones M3 and M4 (DESIGN §15.2, D51, D52, D65): the Compose `core` profile, each one-to-one break injected
  # through the sandbox, detected through the ops API and handled by the resolver and dispatcher, a manual resolution,
  # plus the ingest security checks. The suite runs with Gradle stopped. With the `obs` profile and tracing on (D78),
  # it then checks Prometheus, Grafana and one trace from a webhook to the dispatcher's call in Jaeger.
  e2e-compose:
    name: e2e-compose (Docker Compose, core and obs profiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: End to end
        run: OBS=1 scripts/e2e.sh build/e2e/e2e-compose.txt

      - name: Upload the e2e output and the Compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose
          path: |
            build/e2e/e2e-compose.txt
            deploy/compose/.dev/compose.log
          retention-days: 14

  # Shift 8 (DESIGN §9.4, D65): the matcher and dispatcher containers are killed at random during traffic, then
  # `driftline verify` must find the books clean. The seed of the kill schedule is in the uploaded output.
  chaos-compose:
    name: chaos-compose (kill matcher and dispatcher, then verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Chaos
        run: scripts/chaos.sh build/e2e/chaos-compose.txt

      - name: Upload the chaos output and the Compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-compose
          path: |
            build/e2e/chaos-compose.txt
            deploy/compose/.dev/compose.log
          retention-days: 14

  # DESIGN §14, §16, D79: no secret anywhere in the git history (gitleaks; .gitleaksignore lists each accepted finding),
  # the committed Gradle lockfiles match the build files, and no locked dependency has a high, critical or unscored
  # advisory (OSV-Scanner).
  security:
    name: security (gitleaks, lockfiles, OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secrets in the git history (gitleaks)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --exit-code 1 /repo

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lockfiles match the build files
        run: scripts/check-lockfiles.sh

      - name: Advisories in the locked dependencies (OSV-Scanner)
        run: scripts/osv-scan.sh

  # DESIGN §14, §16, D79: the Gradle dependency graph is submitted for every push to main and every pull request, and a
  # pull request that adds a dependency with a high or critical advisory fails GitHub's dependency review.
  dependency-review:
    name: dependency-review (dependency graph; review on pull requests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the dependency submission API needs it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true

  # DESIGN §13, D78: the Prometheus config and alert rules (with promtool unit tests), the collector config, and the
  # Grafana dashboard against its generator.
  obs-config:
    name: obs-config (promtool, collector, dashboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Observability config
        run: scripts/check-obs-config.sh

  # DESIGN §16, §2.2: no claim-bearing file may claim what Driftline does not guarantee.
  claims-lint:
    name: claims-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Claims lint
        run: scripts/claims-lint.sh
