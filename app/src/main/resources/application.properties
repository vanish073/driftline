spring.application.name=driftline
spring.main.banner-mode=off

# Virtual threads for request handling (D17). The partition driver and settlement worker own platform threads.
spring.threads.virtual.enabled=true
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-swallow-size=64KB

# Actuator only on the management port, never exposed outside the cluster (D21).
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,partitionDriverHealth,settlementWorkerHealth
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Migrations run only in the one-shot migrate role (§15.2); the application role has DML only (§12).
spring.flyway.enabled=false
spring.datasource.hikari.pool-name=driftline
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.maximum-pool-size=8

# Health groups name contributors that exist only in some roles (the driver in matcher, the worker in
# settlement-worker), so a group may list a member this role does not have.
management.endpoint.health.validate-group-membership=false

# API tokens are the only authentication (§14): no generated in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
