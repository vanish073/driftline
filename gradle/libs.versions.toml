# Every version is pinned and was checked on Maven Central on 2026-11-13 (Shift 1). No ranges, no "latest".
#
# Non-Spring modules (core, wire, sim, store-postgres, sandbox, bench) test with JUnit 5 because jqwik 1.10.2
# is built against JUnit Platform 1.14.x. The Spring Boot module (app) uses the JUnit version Boot manages.
# The two never share a test classpath. See DESIGN.md D23.

[versions]
junit5 = "6.1.3"
jqwik = "1.10.2"
archunit = "1.5.1"
assertj = "3.27.7"
spring-boot = "4.1.2"
# store-postgres uses the versions Spring Boot 4.1.2 manages, so app sees no conflicts when it depends on it (D18).
postgresql = "42.7.14"
hikaricp = "7.1.0"
flyway = "13.12.0"
testcontainers = "2.0.5"
# wire uses only Jackson's streaming core, on the Jackson line Spring Boot 4.1.2 manages (DESIGN §18).
jackson = "3.2.4"

[libraries]
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
# Shift 7, sim tests only: the settlement case corpus is YAML (no runtime module gets it).
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Shift 6 (app only; versions managed by the Spring Boot 4.1.2 BOM: Kafka 4.2.2, Micrometer 1.17.2, Flyway 12.4.0,
# Testcontainers 2.0.5).
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Shift 9 (§13, D78): the OpenTelemetry API for manual spans, at the version Spring Boot manages. Without the Java agent
# it is a no-op. The SDK is for app tests only, to capture spans in memory.
# 1.67.0, not Spring Boot's 1.62.0: the API the Java agent 2.33.1 bundles, and the fix for GHSA-ccrj-gw8r-854m (D79).
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version = "1.67.0" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
# Shift 9 (D79): kafka-clients 4.2.2 brings lz4-java 1.11.2 and snappy-java 1.1.10.7, which have high-severity
# advisories (GHSA-mcr4-qmvw-px4g; GHSA-gwq9-9ffj-mvrv, GHSA-q233-g92q-qxp6). app constrains them to patch releases.
lz4-java = { module = "at.yawk.lz4:lz4-java", version = "1.12.1" }
snappy-java = { module = "org.xerial.snappy:snappy-java", version = "1.1.10.12" }
boot-flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
boot-postgresql = { module = "org.postgresql:postgresql" }
boot-testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
boot-testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
# The e2e suite runs from the console launcher while Gradle is stopped (DESIGN §15.1), on the JUnit 5 line (D23).
junit-platform-console-standalone = { module = "org.junit.platform:junit-platform-console-standalone", version = "6.1.3" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
