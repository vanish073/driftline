  ambiguous. Line 2 (1366.96) is uniquely pay_400 + pay_1000; committing it leaves only pay_650 for line 1.
first_settlement_date: "2026-11-14"
payments:
  - {id: pay_250, gross: "250.00", captured: "2026-11-13T09:00:00"}
  - {id: pay_400, gross: "400.00", captured: "2026-11-13T10:00:00"}
  - {id: pay_650, gross: "650.00", captured: "2026-11-13T11:00:00"}
  - {id: pay_1000, gross: "1000.00", captured: "2026-11-13T12:00:00"}
files:
  - csv: golden/batch_propagation.csv
expect:
  lines:
    stl_g5_20261114:1: {status: INFERRED, pays: [pay_650]}
    stl_g5_20261114:2: {status: INFERRED, pays: [pay_1000, pay_400]}
