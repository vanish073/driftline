case: 21
name: noref_zero_amount_line
about: >-
  An unreferenced line of 0.00 settles nothing: it is rejected (ZERO_AMOUNT) and flagged as an
  ORPHAN_SETTLEMENT, with no posting.
payments:
  - {id: pay_1, gross: "499.00", captured: "2026-11-13T10:00:00"}
files:
  - date: "2026-11-14"
    lines:
      - {amount: "0.00"}
expect:
  lines:
    stl_20261114:1: {status: ZERO_AMOUNT}
  breaks:
    - {type: ORPHAN_SETTLEMENT, subject: "stl_20261114:1", reason: ZERO_AMOUNT}
  balances: {SUSPENSE: "0.00"}
