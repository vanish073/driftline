# Prometheus for the Compose `obs` profile (DESIGN §13, §15.1, D78): scrapes every Driftline process's management port
# (D21: inside the Compose network only). DNS discovery finds whichever of the role containers exist: `driftline`
# always, `matcher` and `dispatcher` in the chaos profile; a name that does not resolve yields no target.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: driftline
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [driftline, matcher, dispatcher]
        type: A
        port: 9091
        refresh_interval: 30s
