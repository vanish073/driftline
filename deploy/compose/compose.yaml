# Driftline on one laptop (DESIGN §15.1, §15.2). Profile `core`: PostgreSQL, Kafka (KRaft, one node), the one-shot
# migration and topic services, Driftline with every role in one JVM (ingest, matcher, settlement worker, resolver,
# dispatcher), and the sandbox, which also serves the gateway, merchant and ops APIs the dispatcher calls. Profile `obs`
# (D78): the OpenTelemetry collector, Jaeger, Prometheus and Grafana; set DRIFTLINE_TRACING=true in the env file to turn
# on the Java agent in the Driftline containers. Every image is pinned by digest;
# every service has a memory cap sized for the 4 GB WSL machine. scripts/e2e.sh generates the bootstrap file and the
# secrets (random, never committed) under deploy/compose/.dev/ and runs the e2e suite against it. Secrets are files that
# each service mounts read-only from .dev/secrets/<service>, never environment variables (Shift 11, D97).
# Ports published to the host: 8080 (ingest and ops API) and 8085 (sandbox control API). Actuator (9091) stays inside
# the Compose network (D21).
name: driftline

x-app-image: &app-image
  build:
    context: ../..
    dockerfile: deploy/docker/app.Dockerfile
  image: driftline-app:dev
  # Non-root (uid 10001), read-only root filesystem, only /tmp writable (DESIGN §14, D80).
  read_only: true
  tmpfs:
    - /tmp:size=64m

# What every Driftline service role needs: the database as the DML role, Kafka, the key ids of the secrets key and the
# personal-data keys (D77) and the dev bootstrap. The password, the keys and the service token are files in
# .dev/secrets/app, mounted at /run/secrets/driftline (*app-secrets), never environment variables (D97).
x-app-env: &app-env
  # D100: TLS everywhere inside the stack. PostgreSQL's certificate is verified against the run's CA (verify-full);
  # Kafka is TLS with a password login; the API and the management port serve HTTPS; the JVM trusts the run's CA for
  # its own HTTPS calls (the dispatcher's, the verifier's).
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/driftline?sslmode=verify-full&sslrootcert=/run/tls/ca.crt
  SPRING_DATASOURCE_USERNAME: driftline
  DRIFTLINE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DRIFTLINE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
  DRIFTLINE_KAFKA_USERNAME: driftline
  DRIFTLINE_KAFKA_TRUSTSTORE_FILE: /run/tls/ca.crt
  SERVER_SSL_BUNDLE: server
  MANAGEMENT_SERVER_SSL_BUNDLE: server
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_CERTIFICATE: file:/run/tls/server.crt
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_PRIVATE_KEY: file:/run/tls/server.key
  DRIFTLINE_SECRETS_ACTIVE_KID: dev
  DRIFTLINE_PII_ACTIVE_KID: dev
  DRIFTLINE_BOOTSTRAP_FILE: /bootstrap/bootstrap.json
  # A dev stack (D97): only dev and test may apply the bootstrap file. Production is the default when this is unset.
  DRIFTLINE_ENVIRONMENT: dev
  # -Xms equal to -Xmx (D84): a heap that starts small grows only through full collections, and the load test saw one
  # triggered that way stall the process for 21.8 s; the cap, and so the most the heap can use, is unchanged.
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx256m -XX:+UseSerialGC -Xss512k -Djavax.net.ssl.trustStore=/run/tls/truststore.p12
    -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
  # The OpenTelemetry Java agent (D78): off unless DRIFTLINE_TRACING=true. Spans only, over OTLP to the collector of the
  # `obs` profile; metrics go through Prometheus instead. Its Kafka instrumentation is off, since Driftline carries
  # `traceparent` on records itself (D46), and so is JDBC, so the drivers' polling does not flood the traces.
  OTEL_JAVAAGENT_ENABLED: ${DRIFTLINE_TRACING:-false}
  OTEL_SERVICE_NAME: driftline
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector:4318
  OTEL_EXPORTER_OTLP_CERTIFICATE: /run/tls/ca.crt
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_INSTRUMENTATION_KAFKA_ENABLED: "false"
  OTEL_INSTRUMENTATION_JDBC_ENABLED: "false"

# The dispatcher (D65): the sandbox serves the gateway, the merchant callback and the ops sink. Its gateway forgets an
# idempotency key after 5 minutes; every refund retry looks the refund up first, so no setting depends on that (BUG-008).
x-dispatcher-env: &dispatcher-env
  DRIFTLINE_DISPATCHER_GATEWAY_URL: https://sandbox:8085/gateway
  DRIFTLINE_DISPATCHER_MERCHANT_URL: https://sandbox:8085/merchant
  DRIFTLINE_DISPATCHER_OPS_URL: https://sandbox:8085/ops

# The app's secrets and the dev bootstrap file, read-only.
x-app-volumes: &app-volumes
  - ./.dev/secrets/app:/run/secrets/driftline:ro
  - ./.dev/secrets/tls-app:/run/tls:ro
  - ./.dev/bootstrap.json:/bootstrap/bootstrap.json:ro

# Ready means the readiness group is UP on the management port (D21), over HTTPS (D100).
x-ready: &ready
  test: ["CMD-SHELL", "curl -fsS --cacert /run/tls/ca.crt https://localhost:9091/actuator/health/readiness | grep -q UP"]
  interval: 3s
  timeout: 3s
  retries: 60
  start_period: 20s

services:
  postgres:
    profiles: [core]
    image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
    environment:
      POSTGRES_DB: driftline
      POSTGRES_USER: postgres
      # The superuser's password and the app's (read by postgres-init.sh) are files: run scripts/e2e.sh, or anything
      # that calls stack_secrets, to generate them (D97).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/postgres-password
    # D100: TLS only over the network (pg_hba.conf has hostssl lines and no host lines). PostgreSQL wants its key owned by
    # its own user with mode 0600, so the entrypoint copies the mounted key before starting the server.
    entrypoint: ["bash", "-c", "install -d -o postgres -g postgres -m 700 /var/lib/postgresql/tls
      && install -o postgres -g postgres -m 600 /run/secrets/postgres/server.key /var/lib/postgresql/tls/server.key
      && install -o postgres -g postgres -m 644 /run/secrets/postgres/server.crt /var/lib/postgresql/tls/server.crt
      && exec docker-entrypoint.sh \"$$@\"", "--"]
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40", "-c", "ssl=on",
              "-c", "ssl_cert_file=/var/lib/postgresql/tls/server.crt",
              "-c", "ssl_key_file=/var/lib/postgresql/tls/server.key",
              "-c", "ssl_min_protocol_version=TLSv1.2", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./.dev/secrets/postgres:/run/secrets/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driftline"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  kafka:
    profiles: [core]
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    # D100: clients connect over TLS and log in (SASL PLAIN, only ever over TLS); the controller listener is bound to the
    # container's loopback, so nothing outside the broker's own process can reach it. Credentials and the keystore are
    # files in /etc/kafka/secrets, where the image expects them.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_SSL://:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore-password
      KAFKA_SSL_KEY_CREDENTIALS: key-password
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/ca.crt
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/jaas.conf"
      # D101: deny anything not granted; the broker and the admin are super users, and so is the broker's own
      # unauthenticated principal on the loopback-only controller listener (the broker talks to its controller there).
      # deploy/kafka/init.sh grants the driftline login its one topic and group.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:broker;User:admin;User:ANONYMOUS"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    healthcheck:
      # The CLI must not inherit the broker's -Xms384m, or two JVMs would not fit the container's cap.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /etc/kafka/secrets/client.properties > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    volumes:
      - ./.dev/secrets/kafka:/etc/kafka/secrets:ro
    mem_limit: 640m

  # One topic, 12 partitions (DESIGN §3.3).
  kafka-init:
    profiles: [core]
    image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
    depends_on:
      kafka:
        condition: service_healthy
    # The topic, then the driftline login's permissions (D101); re-running is harmless.
    entrypoint: ["/opt/kafka-init/init.sh"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx64m"
    volumes:
      - ./.dev/secrets/kafka:/etc/kafka/secrets:ro
      - ../kafka/init.sh:/opt/kafka-init/init.sh:ro
    restart: "no"
    mem_limit: 192m

  # Flyway as the schema owner, then exit (DESIGN §15.2): the same image, role `migrate`.
  migrate:
    profiles: [core]
    <<: *app-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DRIFTLINE_ROLE: migrate
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/driftline?sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      SPRING_DATASOURCE_USERNAME: postgres
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC -Xss512k"
    volumes:
      - ./.dev/secrets/migrate:/run/secrets/driftline:ro
      - ./.dev/secrets/tls-client:/run/tls:ro
    restart: "no"
    mem_limit: 256m

  driftline:
    profiles: [core]
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: [*app-env, *dispatcher-env]
      # `all` for the e2e suite; scripts/chaos.sh sets ingest,settlement-worker,resolver and runs the matcher and the
      # dispatcher in containers of their own (profile `chaos`), so it can kill them.
      DRIFTLINE_ROLE: ${DRIFTLINE_CORE_ROLE:-all}
      DRIFTLINE_INSTANCE_ID: driftline-compose
      DRIFTLINE_DISPATCHER_OBSERVATIONS_URL: https://localhost:8080
    volumes: *app-volumes
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck: *ready
    stop_grace_period: 30s
    mem_limit: 512m

  # Profile `chaos` (scripts/chaos.sh): the roles the chaos run kills at random during traffic.
  matcher:
    profiles: [chaos]
    <<: *app-image
    depends_on:
      driftline:
        condition: service_healthy
    environment:
      <<: *app-env
      DRIFTLINE_ROLE: matcher
      DRIFTLINE_INSTANCE_ID: matcher-compose
      OTEL_SERVICE_NAME: driftline-matcher
    volumes: *app-volumes
    healthcheck: *ready
    stop_grace_period: 30s
    mem_limit: 448m

  dispatcher:
    profiles: [chaos]
    <<: *app-image
    depends_on:
      driftline:
        condition: service_healthy
    environment:
      <<: [*app-env, *dispatcher-env]
      DRIFTLINE_ROLE: dispatcher
      DRIFTLINE_INSTANCE_ID: dispatcher-compose
      OTEL_SERVICE_NAME: driftline-dispatcher
      DRIFTLINE_DISPATCHER_OBSERVATIONS_URL: https://driftline:8080
    volumes: *app-volumes
    healthcheck: *ready
    stop_grace_period: 30s
    mem_limit: 448m

  # `driftline verify` (profile `verify`, run once by scripts/chaos.sh): read-only SQL checks of the books against the
  # world, plus the sandbox's refund count; exits non-zero on any violation.
  verify:
    profiles: [verify]
    <<: *app-image
    environment:
      DRIFTLINE_ROLE: verify
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/driftline?sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      SPRING_DATASOURCE_USERNAME: driftline
      DRIFTLINE_VERIFY_SANDBOX_URL: https://sandbox:8085
      DRIFTLINE_VERIFY_WAIT_FOR: ${VERIFY_WAIT_FOR:-5m}
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:+UseSerialGC -Xss512k -Djavax.net.ssl.trustStore=/run/tls/truststore.p12
        -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12"
    volumes:
      - ./.dev/secrets/verify:/run/secrets/driftline:ro
      - ./.dev/secrets/tls-client:/run/tls:ro
    restart: "no"
    mem_limit: 256m

  sandbox:
    profiles: [core]
    build:
      context: ../..
      dockerfile: deploy/docker/sandbox.Dockerfile
    image: driftline-sandbox:dev
    read_only: true
    tmpfs:
      - /tmp:size=32m
    depends_on:
      driftline:
        condition: service_healthy
    # D100: the sandbox serves HTTPS (it plays the gateway, the merchant and the ops sink, which Driftline calls) and
    # calls Driftline over HTTPS; its JVM's keystore is its certificate, its truststore the run's CA.
    command: ["serve", "--bootstrap", "/bootstrap/bootstrap.json", "--driftline", "https://driftline:8080",
              "--port", "8085", "--tls", "true"]
    entrypoint: ["bash", "-c", "export JAVA_OPTS=\"-Djavax.net.ssl.keyStore=/run/tls/server.p12 -Djavax.net.ssl.keyStoreType=PKCS12
      -Djavax.net.ssl.keyStorePassword=$$(cat /run/tls/keystore-password) -Djavax.net.ssl.trustStore=/run/tls/truststore.p12
      -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12\" && exec /app/bin/sandbox \"$$@\"", "--"]
    volumes:
      - ./.dev/bootstrap.json:/bootstrap/bootstrap.json:ro
      - ./.dev/secrets/tls-sandbox:/run/tls:ro
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert /run/tls/ca.crt https://localhost:8085/health | grep -q ok"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m

  # ---- Profile `obs` (DESIGN §13, §15.1, D78): about 0.8 GB of memory caps in all. -----------------------------------

  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - ./.dev/secrets/collector:/run/tls:ro
    depends_on:
      - jaeger
    mem_limit: 96m

  # Jaeger v2 all-in-one, traces in memory only. Its UI has no login, so it is not published (D98): Grafana reads the
  # traces through its Jaeger datasource, behind Grafana's login.
  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    mem_limit: 160m

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    # D98: the UI and the API need a password (web.yml holds its bcrypt hash), and the scrapes send the metrics token.
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d",
              "--storage.tsdb.path=/prometheus", "--web.config.file=/run/secrets/prometheus/web.yml"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./.dev/secrets/prometheus:/run/secrets/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 160m

  # Every user logs in (D98: no anonymous viewing); the admin password is generated per run, as a file. No phoning
  # home. Grafana 13 needs about 340 MB to render the board; at 160 MB it thrashed and queries took minutes (D78).
  grafana:
    profiles: [obs]
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/admin-password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/driftline.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.dev/secrets/grafana:/run/secrets/grafana:ro
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
