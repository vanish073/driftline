# PostgreSQL client authentication for the Compose stack (Shift 11, D100). Over the network only TLS connections are
# accepted (hostssl), each with a SCRAM password; there is no plain `host` line, so a connection without TLS is
# refused. The Unix socket inside the container (initdb, pg_isready, the PII scan's psql) is trusted: only processes in
# the postgres container can reach it.
# TYPE   DATABASE  USER  ADDRESS  METHOD
local    all       all            trust
hostssl  all       all   all      scram-sha-256
