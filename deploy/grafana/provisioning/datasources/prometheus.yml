# The Compose `obs` profile's Prometheus, with a fixed uid the dashboard refers to (DESIGN §13, D78), and Jaeger, whose
# own UI is no longer published (D98): traces are read in Grafana, behind its login. Prometheus asks for a password
# (its web config); Grafana reads it from a mounted file.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    basicAuth: true
    basicAuthUser: prometheus
    secureJsonData:
      basicAuthPassword: $__file{/run/secrets/grafana/prometheus-password}
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
