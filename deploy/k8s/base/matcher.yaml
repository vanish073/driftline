# Generated once from one pod template (D80) and kept by hand; every role runs the same hardened pod.
# The matcher (§5.1): Kafka assigns partitions, the epoch in PostgreSQL fences; at most one replica per partition (12) does work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
  labels:
    app.kubernetes.io/name: driftline
    app.kubernetes.io/component: matcher
    driftline.io/stage: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: driftline
      app.kubernetes.io/component: matcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driftline
        app.kubernetes.io/component: matcher
        driftline.io/stage: app
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: driftline
          image: driftline-app
          env:
            - name: DRIFTLINE_ROLE
              value: matcher
            - name: DRIFTLINE_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          envFrom:
            - configMapRef: {name: driftline-config}
            - secretRef: {name: driftline-secrets}
          ports:
            - name: management
              containerPort: 9091
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 320Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: matcher
  labels:
    app.kubernetes.io/name: driftline
    app.kubernetes.io/component: matcher
    driftline.io/stage: app
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: driftline
      app.kubernetes.io/component: matcher
