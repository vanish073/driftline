# Flyway as the schema owner (§15.2, D29), then exit: the same image, role `migrate`, with the migrator's credentials.
# Apply it and wait for it to complete before the roles (scripts/kind-smoke.sh does).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: driftline
    app.kubernetes.io/component: migrate
    driftline.io/stage: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: driftline
        app.kubernetes.io/component: migrate
        driftline.io/stage: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: driftline
          image: driftline-app
          env:
            - name: DRIFTLINE_ROLE
              value: migrate
            - name: DRIFTLINE_INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          envFrom:
            - configMapRef: {name: driftline-config}
            - secretRef: {name: driftline-migrator}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
