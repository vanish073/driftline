# Secret TEMPLATES (§15.3): the keys each Secret must hold, never their values; this file is not in any
# kustomization. Create the Secrets from a secret manager, or as scripts/kind-smoke.sh does for a throwaway cluster.
# Keys are 32 random bytes in base64 (openssl rand -base64 32).
apiVersion: v1
kind: Secret
metadata:
  name: driftline-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: ""          # the password of the DML login `driftline` (role driftline_app)
  DRIFTLINE_SECRETS_KEYS_K1: ""           # AES-256 key for stored webhook secrets; K1 matches DRIFTLINE_SECRETS_ACTIVE_KID
  DRIFTLINE_PII_KEYS_P1: ""               # AES-256 key for customers' contacts (D77); P1 matches DRIFTLINE_PII_ACTIVE_KID
  DRIFTLINE_PII_INDEX_KEY: ""             # HMAC key, at least 32 bytes, for the VPA blind index (D77)
  DRIFTLINE_DISPATCHER_SERVICE_TOKEN: ""  # the token the dispatcher posts observations with (scope observations:write)
---
apiVersion: v1
kind: Secret
metadata:
  name: driftline-migrator
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: ""          # the schema owner (driftline_migrator, or a login in it)
  SPRING_DATASOURCE_PASSWORD: ""
