# Secret TEMPLATES (§15.3): the keys each Secret must hold, never their values; this file is not in any
# kustomization. Create the Secrets from a secret manager, or as scripts/kind-smoke.sh does for a throwaway cluster.
# Keys are 32 random bytes in base64 (openssl rand -base64 32).
apiVersion: v1
kind: Secret
metadata:
  name: driftline-secrets
type: Opaque
# Each key is mounted as a file under /run/secrets/driftline, and its name is the setting it holds (D97: secrets are
# files, never environment variables; a production start refuses secrets in its environment).
stringData:
  spring.datasource.password: ""          # the password of the DML login `driftline` (role driftline_app)
  driftline.secrets.keys.k1: ""           # AES-256 key for stored webhook secrets; k1 matches DRIFTLINE_SECRETS_ACTIVE_KID
  driftline.pii.keys.p1: ""               # AES-256 key for customers' contacts (D77); p1 matches DRIFTLINE_PII_ACTIVE_KID
  driftline.pii.index-key: ""             # HMAC key, at least 32 bytes, for the VPA blind index (D77)
  driftline.dispatcher.service-token: ""  # the token the dispatcher posts observations with (scope observations:write;
                                          # it expires, D95: create its successor with the token API, then roll)
---
apiVersion: v1
kind: Secret
metadata:
  name: driftline-migrator
type: Opaque
stringData:
  spring.datasource.username: ""          # the schema owner (driftline_migrator, or a login in it)
  spring.datasource.password: ""
---
# D100: the TLS material every Driftline role mounts at /run/tls. server.crt names every Service the roles answer on
# (ingest, matcher, settlement-worker, resolver, dispatcher); truststore.p12 (password "changeit", which protects only
# its integrity) holds ca.crt for the JVM's own HTTPS calls; the database's and Kafka's certificates are checked
# against ca.crt.
apiVersion: v1
kind: Secret
metadata:
  name: driftline-tls
type: Opaque
stringData:
  ca.crt: ""
  server.crt: ""
  server.key: ""
data:
  truststore.p12: ""
