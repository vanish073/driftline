# Dev-only Kafka 4 in KRaft mode, one node (§15.3), configured as in Compose, and the one-shot topic job (12
# partitions). Only Driftline's pods and the topic job may connect (network-policies.yaml).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, driftline.io/stage: infra}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, driftline.io/stage: infra}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, driftline.io/stage: infra}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false   # a KAFKA_PORT variable from the Service would confuse the image's start script
      containers:
        - name: kafka
          image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            # D100: clients use TLS and log in (SASL PLAIN, only over TLS); the controller listener is on the pod's
            # loopback only. The keystore and the logins are the Secret driftline-kafka, in /etc/kafka/secrets.
            - {name: KAFKA_LISTENERS, value: "SASL_SSL://:9092,CONTROLLER://127.0.0.1:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "SASL_SSL://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: SASL_SSL}
            - {name: KAFKA_SASL_ENABLED_MECHANISMS, value: PLAIN}
            - {name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL, value: PLAIN}
            - {name: KAFKA_SSL_KEYSTORE_FILENAME, value: kafka.p12}
            - {name: KAFKA_SSL_KEYSTORE_TYPE, value: PKCS12}
            - {name: KAFKA_SSL_KEYSTORE_CREDENTIALS, value: keystore-password}
            - {name: KAFKA_SSL_KEY_CREDENTIALS, value: key-password}
            - {name: KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM, value: https}
            - {name: KAFKA_SSL_TRUSTSTORE_TYPE, value: PEM}
            - {name: KAFKA_SSL_TRUSTSTORE_LOCATION, value: /etc/kafka/secrets/ca.crt}
            - {name: KAFKA_OPTS, value: "-Djava.security.auth.login.config=/etc/kafka/secrets/jaas.conf"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx384m -Xms384m"}
          ports:
            - {name: kafka, containerPort: 9092}
          readinessProbe:
            exec:
              command: ["bash", "-c", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties > /dev/null 2>&1"]
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 60
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: secrets, mountPath: /etc/kafka/secrets, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - name: secrets
          secret: {secretName: driftline-kafka, defaultMode: 0444}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels: {app.kubernetes.io/name: kafka-init, driftline.io/stage: infra}
spec:
  backoffLimit: 20
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-init, driftline.io/stage: infra}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
          command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092",
                    "--command-config", "/etc/kafka/secrets/client.properties", "--create", "--if-not-exists",
                    "--topic", "driftline.events.v1", "--partitions", "12", "--replication-factor", "1"]
          env:
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx64m"}
          resources:
            limits: {memory: 192Mi}
          volumeMounts:
            - {name: secrets, mountPath: /etc/kafka/secrets, readOnly: true}
      volumes:
        - name: secrets
          secret: {secretName: driftline-kafka, defaultMode: 0444}
