# The kind overlay's own NetworkPolicies (D80), on top of the base's default deny: PostgreSQL only from Driftline's
# pods, Kafka only from Driftline's pods and the topic job, and the sandbox (a dev-only fake) from anywhere, since the
# e2e suite outside the cluster drives it through a NodePort. scripts/kind-smoke.sh checks that an unlabelled pod
# cannot reach PostgreSQL or Kafka but can reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-driftline
  labels: {driftline.io/stage: infra}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: driftline}
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-from-driftline
  labels: {driftline.io/stage: infra}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: driftline}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: kafka-init}
      ports:
        - {port: 9092, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-http
  labels: {driftline.io/stage: infra}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sandbox}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8085, protocol: TCP}
