# The kind cluster scripts/kind-smoke.sh creates (D80): one node, Kubernetes 1.37 pinned by digest (the default of kind
# v0.33.0, whose built-in kube-network-policies enforces NetworkPolicy), and the API and the sandbox published on
# 127.0.0.1:18080 and :18085 through NodePorts, for the e2e suite that runs outside the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - {containerPort: 30080, hostPort: 18080, listenAddress: "127.0.0.1"}
      - {containerPort: 30085, hostPort: 18085, listenAddress: "127.0.0.1"}
