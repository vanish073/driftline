# Dev-only PostgreSQL 17 (§15.3), as in Compose: the init script creates the NOLOGIN roles and the DML login, data in
# an emptyDir (a throwaway cluster). Only Driftline's pods may connect (network-policies.yaml).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, driftline.io/stage: infra}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, driftline.io/stage: infra}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, driftline.io/stage: infra}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=60"]
          env:
            - {name: POSTGRES_DB, value: driftline}
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom:
            - secretRef: {name: driftline-infra}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, driftline]}
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - name: init
          configMap: {name: postgres-init}
